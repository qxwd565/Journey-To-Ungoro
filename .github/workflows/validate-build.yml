name: Validate and build card API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test history operations
        run: python -m unittest discover -s tests -v
      - name: Build API indexes
        run: python tools/build-api.py
      - name: Commit generated indexes and release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json render.json history.json data/*.json
          if git diff --cached --quiet; then
            echo "Generated API is already up to date."
            exit 0
          fi
          git commit -m "Regenerate dated card API and compatibility indexes"
          git push origin HEAD:main
